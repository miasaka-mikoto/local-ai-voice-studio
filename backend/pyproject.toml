[project]
name = "local-ai-voice-studio-backend"
version = "0.1.0"
description = "Local-only FastAPI and SQLite core for Local AI Voice Studio"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2",
  "pydantic==2.13.4",
  "uvicorn==0.51.0",
  "websockets==16.1.1",
  "numpy==2.5.1",
  "Pillow==12.3.0",
]

[tool.unittest]
start-directory = "tests"
