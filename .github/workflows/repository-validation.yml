name: Repository validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      GRADIO_ANALYTICS_ENABLED: 'False'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install "pytest>=8,<9" httpx -r backend/requirements.txt
      - name: Run real offline regression tests
        run: python .github/scripts/offline_tests.py backend/tests adapters/tests
  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
      EXPO_PUBLIC_API_BASE_URL: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Component and logic tests
        run: npm test
      - name: Production build
        run: npm run build
